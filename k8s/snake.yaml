apiVersion: apps/v1
kind: Deployment
metadata: { name: snake }
spec:
  replicas: 2
  selector: { matchLabels: { app: snake } }
  template:
    metadata: { labels: { app: snake } }
    spec:
      containers:
      - name: snake
        image: ghcr.io/brisa-hernandez/snake:v2
        ports: [{ containerPort: 3000 }]
        env:
        - { name: PGSSL, value: "1" }
        - name: DATABASE_URL
          valueFrom: { secretKeyRef: { name: db-secret, key: url } }
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { cpu: 300m, memory: 256Mi }
        readinessProbe: { httpGet: { path: /healthz, port: 3000 } }
---
apiVersion: v1
kind: Service
metadata: { name: snake }
spec:
  selector: { app: snake }
  ports: [{ port: 80, targetPort: 3000 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: snake
  annotations:
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - { path: /, pathType: Prefix, backend: { service: { name: snake, port: { number: 80 } } } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: snake }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: snake }
  minReplicas: 2
  maxReplicas: 3
  metrics:
  - type: Resource
    resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
